[project]
name = "mercabiliza-onboarding"
version = "2.0.0"
description = "Inteligência tributária e onboarding contábil para minimercados autônomos"
requires-python = ">=3.11"

[tool.ruff]
line-length = 95
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ISC", "PTH"]
ignore = [
    "E501",    # comprimento tratado pelo formatador
    "RUF001",  # caracteres unicode ambíguos: o app é em pt-BR, é esperado
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]
